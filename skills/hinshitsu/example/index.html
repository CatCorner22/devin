<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split the bill</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1rem; font: 1rem/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  main { max-width: 30rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  .field { margin-top: 1rem; }
  label { display: block; font-weight: 600; }
  input { display: block; width: 100%; margin-top: 0.25rem; padding: 0.6rem; font: inherit; border: 1px solid #555; border-radius: 0.25rem; }
  input[aria-invalid="true"] { border-color: #a40000; box-shadow: inset 0 0 0 1px #a40000; }
  .error { min-height: 1.5rem; margin: 0.25rem 0 0; color: #a40000; overflow-wrap: anywhere; }
  #result { overflow-wrap: anywhere; }
  #result .box { margin-top: 1rem; padding: 1rem; border: 1px solid #555; border-radius: 0.25rem; }
  #result p { margin: 0; }
  #result .pay { font-size: 1.25rem; font-weight: 600; }
  #result .gap-above { margin-top: 0.5rem; }
</style>
</head>
<body>
<main>
  <h1>Split the bill</h1>
  <noscript><p>This calculator needs JavaScript. Turn JavaScript on in your browser, then reload this page.</p></noscript>
  <p id="guide" hidden>Type the bill total, the tip percent and the number of people.</p>
  <div id="fields" hidden>
    <div class="field">
      <label for="bill">Bill total, tax included</label>
      <input id="bill" type="text" inputmode="decimal" autocomplete="off" aria-required="true" aria-describedby="bill-error">
      <p class="error" id="bill-error" role="alert"></p>
    </div>
    <div class="field">
      <label for="tip">Tip percent</label>
      <input id="tip" type="text" inputmode="numeric" autocomplete="off" aria-required="true" aria-describedby="tip-error">
      <p class="error" id="tip-error" role="alert"></p>
    </div>
    <div class="field">
      <label for="people">Number of people</label>
      <input id="people" type="text" inputmode="numeric" autocomplete="off" aria-required="true" aria-describedby="people-error">
      <p class="error" id="people-error" role="alert"></p>
    </div>
  </div>
  <div id="result" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
"use strict";

var MAX_BILL_CENTS = 100000000;
var MAX_TIP_PERCENT = 100;
var MAX_PEOPLE = 100;

/* The only code that computes the tip, the total and the payments. Whole numbers in, whole numbers out. */
function splitBill(billCents, tipPercent, people) {
  var tipCents = Math.floor((billCents * tipPercent + 50) / 100);
  var totalCents = billCents + tipCents;
  var base = Math.floor(totalCents / people);
  var payOneMore = totalCents % people;
  var shares = [];
  if (payOneMore > 0) { shares.push({ count: payOneMore, cents: base + 1 }); }
  shares.push({ count: people - payOneMore, cents: base });
  return { tipCents: tipCents, totalCents: totalCents, shares: shares };
}
/* Reachable from the browser console as window.splitBill (contract: run/FRAMEWORK.md, part 4). */
window.splitBill = splitBill;

/* Characters that count as a plain digit, dot or comma: full-width, Arabic-Indic and Extended Arabic-Indic digits;
   the full-width dot and comma; the Arabic decimal mark. No other character is changed. */
function plainChar(c) {
  var code = c.charCodeAt(0);
  if (code >= 0xFF10 && code <= 0xFF19) { return String(code - 0xFF10); }
  if (code >= 0x0660 && code <= 0x0669) { return String(code - 0x0660); }
  if (code >= 0x06F0 && code <= 0x06F9) { return String(code - 0x06F0); }
  if (code === 0xFF0E) { return "."; }
  if (code === 0xFF0C || code === 0x066B) { return ","; }
  return c;
}

/* White space and characters that show nothing: Unicode format characters, default-ignorable code points, the blank braille pattern. */
var IGNORED_AT_ENDS = /[\s\p{Cf}\p{Default_Ignorable_Code_Point}\u2800]/u;

/* The text without ignored characters at either end, with each counted character in its plain form. */
function plain(text) {
  var chars = Array.from(text);
  var start = 0;
  var end = chars.length;
  while (start < end && IGNORED_AT_ENDS.test(chars[start])) { start += 1; }
  while (end > start && IGNORED_AT_ENDS.test(chars[end - 1])) { end -= 1; }
  return chars.slice(start, end).map(plainChar).join("");
}

/* Text to cents, from the digits. The decimal mark is a dot or a comma. Returns { cents }, { error } or,
   while the bill field has keyboard focus and the amount ends in a decimal mark, { waiting }. */
function readAmount(text, hasFocus) {
  var s = plain(text);
  if (s === "") { return { error: "Type the bill total." }; }
  var m = /^(\d+)(?:[.,](\d{1,2}))?$/.exec(s);
  if (!m && hasFocus && /^\d+[.,]$/.test(s)) { return { waiting: true }; }
  if (!m) { return { error: "Type the amount in digits only, such as 12.50 or 12,50. Leave out currency signs and thousands separators." }; }
  var whole = m[1].replace(/^0+(?=\d)/, "");
  var tooMuch = "Type " + money(MAX_BILL_CENTS) + " or less.";
  if (whole.length > String(MAX_BILL_CENTS / 100).length) { return { error: tooMuch }; }
  var cents = parseInt(whole, 10) * 100 + parseInt(((m[2] || "") + "00").slice(0, 2), 10);
  if (cents === 0) { return { error: "Type an amount above 0." }; }
  if (cents > MAX_BILL_CENTS) { return { error: tooMuch }; }
  return { cents: cents };
}

/* Text to a whole number from min to max. Returns { value } or { error }. */
function readWhole(text, min, max, emptyMessage) {
  var s = plain(text);
  var message = "Type a whole number from " + min + " to " + max + ", in digits only.";
  if (s === "") { return { error: emptyMessage }; }
  if (!/^\d+$/.test(s)) { return { error: message }; }
  var digits = s.replace(/^0+(?=\d)/, "");
  if (digits.length > String(max).length) { return { error: message }; }
  var value = parseInt(digits, 10);
  if (value < min || value > max) { return { error: message }; }
  return { value: value };
}

function money(cents) {
  var rest = cents % 100;
  return Math.floor(cents / 100) + "." + (rest < 10 ? "0" : "") + rest;
}

function payLine(share) {
  return share.count === 1
    ? "1 person pays " + money(share.cents)
    : share.count + " people pay " + money(share.cents) + " each";
}

var fields = {
  bill: { read: function (t) { return readAmount(t, document.activeElement === fields.bill.input); } },
  tip: { read: function (t) { return readWhole(t, 0, MAX_TIP_PERCENT, "Type the tip percent. Type 0 for no tip."); } },
  people: { read: function (t) { return readWhole(t, 1, MAX_PEOPLE, "Type the number of people."); } }
};
var resultBox = document.getElementById("result");
var shownResult = "";

/* Writes the result only when its lines change, so that a screen reader is not told the same thing twice. */
function showResult(lines) {
  var key = lines.map(function (line) { return line.text; }).join("\n");
  if (key === shownResult) { return; }
  shownResult = key;
  resultBox.textContent = "";
  if (lines.length === 0) { return; }
  var box = document.createElement("div");
  box.className = "box";
  lines.forEach(function (line) {
    var p = document.createElement("p");
    p.textContent = line.text;
    if (line.className) { p.className = line.className; }
    box.appendChild(p);
  });
  resultBox.appendChild(box);
}

function update() {
  var parsed = {};
  var allValid = true;
  Object.keys(fields).forEach(function (name) {
    var f = fields[name];
    var r = f.read(f.input.value);
    parsed[name] = r;
    var showError = Boolean(r.error) && f.touched;
    var text = showError ? r.error : "";
    if (f.errorBox.textContent !== text) { f.errorBox.textContent = text; }
    if (showError) { f.input.setAttribute("aria-invalid", "true"); } else { f.input.removeAttribute("aria-invalid"); }
    if (r.error || r.waiting) { allValid = false; }
  });
  if (!allValid) { showResult([]); return; }
  var out = splitBill(parsed.bill.cents, parsed.tip.value, parsed.people.value);
  var lines = [
    { text: "Bill total: " + money(parsed.bill.cents) },
    { text: "Tip percent: " + parsed.tip.value },
    { text: "Number of people: " + parsed.people.value },
    { text: "Tip amount: " + money(out.tipCents), className: "gap-above" },
    { text: "Total with tip: " + money(out.totalCents) }
  ];
  out.shares.forEach(function (share, i) { lines.push({ text: payLine(share), className: i === 0 ? "pay gap-above" : "pay" }); });
  if (out.shares.length === 2) { lines.push({ text: "Your group decides who pays the higher amount." }); }
  showResult(lines);
}

Object.keys(fields).forEach(function (name) {
  var f = fields[name];
  f.input = document.getElementById(name);
  f.errorBox = document.getElementById(name + "-error");
  f.touched = false;
  f.input.addEventListener("input", function () { f.touched = true; update(); });
  f.input.addEventListener("focus", update);
  /* A switch to another window fires blur while the field keeps keyboard focus; that is not leaving the field. */
  f.input.addEventListener("blur", function () {
    if (document.activeElement === f.input) { return; }
    f.touched = true;
    update();
  });
});

/* A reload or a return through the back button starts from 3 empty fields. */
window.addEventListener("pageshow", function () {
  Object.keys(fields).forEach(function (name) {
    fields[name].input.value = "";
    fields[name].touched = false;
  });
  update();
});
/* The guidance and the fields show only when this script runs. */
document.getElementById("guide").hidden = false;
document.getElementById("fields").hidden = false;
}());
</script>
</body>
</html>
